[project]
name = "batch_elt"
requires-python = ">=3.10,<3.13"
version = "0.1.0"
dependencies = [
    "dagster~=1.11.16",
    "dagster-dbt",
    "dagster-duckdb",
    "dbt-core~=1.9.0",
    "dbt-duckdb~=1.9.0",
    "duckdb>=1.4.4",
    "fastparquet>=2025.12.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "dagster-webserver~=1.11.16",
    "dagster-dg-cli~=1.11.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "batch_elt"
registry_modules = [
    "batch_elt.components.*",
]




