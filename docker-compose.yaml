services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: frank
      POSTGRES_PASSWORD: migiberto
      POSTGRES_DB: dagster_postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frank  -d dagster_postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dagster_network

  batch_elt:
    build:
      context: .
      dockerfile: batch_elt/Dockerfile
    image: batch_elt_image
    environment:
      DAGSTER_CURRENT_IMAGE: "batch_elt_image"
    expose:
      - "4000"
    networks:
      - dagster_network
    depends_on:
      - postgres
    volumes:
      - ./batch_elt/data:/opt/dagster/app/data
      - ./duckdb:/opt/dagster/app/duckdb

  batch_elt_components:
    build:
      context: .
      dockerfile: batch_elt_components/Dockerfile
    image: batch_elt_components_image
    environment:
      DAGSTER_CURRENT_IMAGE: "batch_elt_components_image"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    expose:
      - "4000"
    networks:
      - dagster_network
    depends_on:
      - postgres
    volumes:
      - ./batch_elt_components/data:/opt/dagster/app/data
      - ./duckdb:/opt/dagster/duckdb
      # DuckLake catalog now stores a RELATIVE data_path
      # (../../duckdb/my_ducklake.ddb.files/), resolved from dbt's working dir.
      # The single ./duckdb mount above is enough — no host-specific path needed.
      # only use it  for development
      - ./batch_elt_components/src:/opt/dagster/app/src
      # only use it for development
      - ./dbt:/opt/dagster/dbt
      # data dictionary host
      - ./docs/data_dictionary:/opt/dagster/app/docs/data_dictionary

  dagster_webserver:
    build:
      context: .
      dockerfile: Dockerfile
    command: dagster-webserver -h 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    networks:
      - dagster_network
    depends_on:
      postgres:
        condition: service_healthy
      batch_elt:
        condition: service_started
      batch_elt_components:
        condition: service_started
  dagster_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    command: dagster-daemon run
    networks:
      - dagster_network
    depends_on:
      postgres:
        condition: service_healthy
      batch_elt:
        condition: service_started
      batch_elt_components:
        condition: service_started
#add metabase image here
  metabase:
    build:
      context: .
      dockerfile: metabase.dockerfile.yaml
    container_name: metabase_duckdb
    ports:
      - "8080:3000"
    volumes:
      # Persist Metabase's own app DB (H2). Must match MB_DB_FILE's parent
      # directory set in metabase.dockerfile.yaml (/home/metabase/data).
      - metabase_data:/home/metabase/data
      # Expose your DuckDB files to Metabase. Inside the container they live
      # at /opt/dagster/duckdb, so connect using e.g.
      #   /opt/dagster/duckdb/data.duckdb
      - ./duckdb:/opt/dagster/duckdb
    # NOTE: MB_PLUGINS_DIR and MB_DB_FILE are now set inside the Dockerfile,
    # so we no longer override them here.
    restart: unless-stopped

networks:
  dagster_network:
    driver: bridge

volumes:
  metabase_data:





