[project]
name = "batch_elt_components"
requires-python = ">=3.10,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.11.8",
    "dagster-dbt>=0.27.8",
    "dagster-duckdb>=0.27.8",
    "dagster-openai>=0.27.8",
    "dagster-postgres",
    "dbt-core>=1.10.20",
    "dbt-duckdb~=1.9.0",
    "duckdb~=1.4.4",
    "fastmcp>=3.2.4",
    "openai>=2.33.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "batch_elt_components"
registry_modules = [
    "batch_elt_components.components.*",
]


